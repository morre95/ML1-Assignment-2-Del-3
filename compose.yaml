services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOME: /tmp
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PYTHONPATH: /workspace/src
      REACT_AGENT_APP_TITLE: ${REACT_AGENT_APP_TITLE:-ReAct Agent System}
      REACT_AGENT_HUB_AGENT_NAME: ${REACT_AGENT_HUB_AGENT_NAME:-cryptofarian-builder}
      REACT_AGENT_HUB_AGENT_ROLE: ${REACT_AGENT_HUB_AGENT_ROLE:-You are a concise software-building agent in a group chat.}
      REACT_AGENT_HUB_PASSWORD: ${REACT_AGENT_HUB_PASSWORD:-}
      REACT_AGENT_HUB_URL: ${REACT_AGENT_HUB_URL:-https://wb48jtfnjng6on-8080.proxy.runpod.net}
      REACT_AGENT_HTTP_REFERER: ${REACT_AGENT_HTTP_REFERER:-http://localhost}
      REACT_AGENT_MODEL: ${REACT_AGENT_MODEL:-openai/gpt-5.2}
      REACT_AGENT_SESSION_DB: /workspace/sessions/agent-history.sqlite3
    stdin_open: true
    tty: true
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
