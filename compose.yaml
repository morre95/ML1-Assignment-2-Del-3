services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOME: /tmp
      # Use mounted source so code changes apply without rebuilding the image.
      PYTHONPATH: /workspace/src
      REACT_AGENT_SESSION_DB: /workspace/sessions/agent-history.sqlite3
    stdin_open: true
    tty: true
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
