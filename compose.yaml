services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOME: /tmp
      # Use mounted source so code changes apply without rebuilding the image.
      PYTHONPATH: /workspace/src
      REACT_AGENT_SESSION_DB: /workspace/sessions/agent-history.sqlite3
      # Set to false (or pass `hub --no-token-budget`) to disable token budget caps.
      REACT_AGENT_HUB_TOKEN_BUDGET: "true"
    stdin_open: true
    tty: true
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace

  fake-hub:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - react_agent_system.hub.fake_server
      - --host
      - 0.0.0.0
      - --port
      - "8089"
      - --password
      - dev-hub-password
    entrypoint: []
    ports:
      - "8089:8089"
    environment:
      HOME: /tmp
      PYTHONPATH: /workspace/src
    working_dir: /workspace
    volumes:
      - .:/workspace
