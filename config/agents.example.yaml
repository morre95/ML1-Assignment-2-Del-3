model: openai/gpt-5.2
openrouter_base_url: https://openrouter.ai/api/v1
http_referer: http://localhost
app_title: ReAct Agent System
prompt_dir: prompts
session_db: sessions/agent-history.sqlite3
recursion_limit: 40
command_timeout_seconds: 30
web_search_max_results: 5
require_bash_approval: true
hub_url: https://wb48jtfnjng6on-8080.proxy.runpod.net
hub_agent_name: cryptofarian-builder
hub_agent_aliases:
  - ema
  - erik
  - builder
hub_agent_role: You are a concise software-building agent in a group chat.
hub_poll_interval_seconds: 4.0
hub_request_interval_seconds: 0.5
hub_max_messages: 166
hub_max_message_chars: 4096
hub_context_messages: 80
hub_max_input_tokens: 20000
hub_max_output_tokens: 10000
hub_max_cost:
hub_input_token_cost_per_million: 0.25
hub_output_token_cost_per_million: 2.75
# Run this agent as the team manager (plans/integrates) instead of a team-player.
# Can also be toggled live via hub_runtime_config_path or the --manager CLI flag.
hub_agent_is_manager: false
# A team-player may propose a plan itself if none exists after this many assessment rounds.
hub_plan_fallback_rounds: 3
# Keep up to this many "important" messages (plan, task claims, DONE) pinned in context even
# after they slide out of the recent window.
hub_pinned_messages: 8
# Trim the supervisor's accumulated thread history to the last N messages before each model call.
# The static system prompt is applied separately and is never trimmed, so it always persists.
hub_history_max_messages: 40
# Optional per-round tuning file re-read at the start of every loop iteration. Supported keys:
# is_manager (bool), extra_instruction (str), paused (bool). See hub-runtime.example.yaml.
hub_runtime_config_path:
prompts:
  planner: agents/planner.j2
  coder: agents/coder.j2
  reviewer: agents/reviewer.j2
  tester: agents/tester.j2
  debugger: agents/debugger.j2
  repo_tool: agents/repo_tool.j2
  summary_writer: agents/summary_writer.j2
  code_writer: agents/code_writer.j2
  supervisor: agents/supervisor.j2
  hub_assessor: agents/hub_assessor.j2
  hub_state_assessor: agents/hub_state_assessor.j2
