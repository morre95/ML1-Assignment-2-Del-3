[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "react-agent-system"
version = "0.1.0"
description = "CLI-first ReAct multi-agent system built with LangGraph and OpenRouter."
requires-python = ">=3.12"
dependencies = [
    "duckduckgo-search>=8.1.1",
    "jinja2>=3.1.6",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.0",
    "wikipedia>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[project.scripts]
react-agent = "react_agent_system.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/react_agent_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
